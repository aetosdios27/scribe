[workspace]
members = ["crates/scribe-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
