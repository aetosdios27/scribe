name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-cli:
    name: Native CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true

          - os: macos-15-intel
            target: x86_64-apple-darwin

          - os: macos-14
            target: aarch64-apple-darwin

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.musl == true
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build native CLI
        run: >-
          cargo build
          --locked
          --release
          --target ${{ matrix.target }}

      - name: Stage native npm package
        run: >-
          node scripts/stage-native-cli.mjs
          ${{ matrix.target }}
          target/${{ matrix.target }}/release/scribe-cli${{ matrix.extension }}

      - name: Upload native npm package
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: packages/cli/native
          if-no-files-found: error
          retention-days: 7

  verify-linux:
    name: Release verification (Linux)
    runs-on: ubuntu-latest
    needs: native-cli
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Set up Rust quality tools
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --all-targets
          --all-features
          --locked
          --
          -D warnings

      - name: Test Rust
        run: >-
          cargo test
          --all-targets
          --all-features
          --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Download native CLI packages
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: packages/cli/native
          merge-multiple: true

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify documentation copies
        run: bun run docs:check

      - name: Verify portable repository boundaries
        run: bun run portability:check

      - name: Verify release and package alignment
        run: bun run release:check

      - name: Build public packages
        run: bun run build

      - name: Typecheck with TypeScript 7
        run: bun run typecheck

      - name: Typecheck with TypeScript 6
        run: >-
          node
          ./node_modules/typescript/bin/tsc
          --noEmit
          -p
          tsconfig.json

      - name: Run unit, transformation, release, and surface tests
        run: bun run test

      - name: Build Vite fixture
        run: bun run build
        working-directory: tests/integration/vite

      - name: Build Next.js fixture
        run: bun run build
        working-directory: tests/integration/next

      - name: Dry-run package contents
        run: bun run release:pack:dry

      - name: Pack npm tarballs
        run: bun run release:pack

      - name: Inspect npm tarballs
        run: bun run release:inspect

      - name: Scan browser bundles
        run: bun run release:bundle-scan

      - name: Audit production dependencies
        run: bun run release:audit

      - name: Check repository whitespace
        run: git diff --check

      - name: Confirm verification leaves tracked files unchanged
        run: git diff --exit-code

      - name: Upload release diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: verify-linux-diagnostics
          path: |
            .scribe-release/*.json
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  portable-os:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: native-cli
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Download native CLI packages
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: packages/cli/native
          merge-multiple: true

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify documentation copies
        run: bun run docs:check

      - name: Verify portable repository boundaries
        run: bun run portability:check

      - name: Verify release and package alignment
        run: bun run release:check

      - name: Build public packages
        run: bun run build

      - name: Typecheck with TypeScript 7
        run: bun run typecheck

      - name: Typecheck with TypeScript 6
        run: >-
          node
          ./node_modules/typescript/bin/tsc
          --noEmit
          -p
          tsconfig.json

      - name: Pack npm tarballs
        run: bun run release:pack

      - name: Install tarballs and smoke-test CLI
        run: bun run test:portability

      - name: Upload portability diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: portability-${{ matrix.os }}
          path: .scribe-release/*.json
          if-no-files-found: ignore
          retention-days: 7

  browser-engines:
    name: Browser behavior (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build public packages
        run: bun run build

      - name: Set up Rust for Studio
        if: matrix.browser == 'chromium'
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build native CLI for Studio
        if: matrix.browser == 'chromium'
        run: >-
          cargo build
          --locked
          --release
          --target x86_64-unknown-linux-gnu

      - name: Stage native CLI for Studio
        if: matrix.browser == 'chromium'
        run: >-
          node scripts/stage-native-cli.mjs
          x86_64-unknown-linux-gnu
          target/x86_64-unknown-linux-gnu/release/scribe-cli

      - name: Install Playwright ${{ matrix.browser }}
        run: >-
          bunx playwright install
          --with-deps
          ${{ matrix.browser }}

      - name: Run ${{ matrix.browser }} behavior suite
        run: bun run test:browser:${{ matrix.browser }}

      - name: Run Studio browser flow
        if: matrix.browser == 'chromium'
        run: bun run test:studio:browser -- --project=chromium

      - name: Upload browser diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.browser }}-diagnostics
          path: |
            playwright-report/portable
            test-results/playwright-portable
          if-no-files-found: ignore
          retention-days: 7
