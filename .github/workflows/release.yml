name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  native-cli:
    name: Native CLI (${{ matrix.target }})
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.musl == true
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build native CLI
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage native npm package
        run: node scripts/stage-native-cli.mjs ${{ matrix.target }} target/${{ matrix.target }}/release/scribe-cli${{ matrix.extension }}

      - name: Upload native npm package
        uses: actions/upload-artifact@v7
        with:
          name: release-native-${{ matrix.target }}
          path: packages/cli-native
          if-no-files-found: error
          retention-days: 7

  release:
    name: Version or publish packages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    needs: native-cli
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm the verified commit
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.6.2

      - name: Download native CLI packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-native-*
          path: packages/cli-native
          merge-multiple: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release alignment
        run: bun run release:check

      - name: Create or update the version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI on the generated version pull request
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build publishable packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run build

      - name: Pack release artifacts
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run release:pack

      - name: Inspect release artifacts
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run release:inspect

      - name: Publish unpublished packages with npm OIDC
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run release:packages
