name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Version or publish packages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm the verified commit
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.6.2

      - name: Download native CLI packages
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: packages/cli/native
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-pkg-v1-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-pkg-v1-${{ runner.os }}-${{ runner.arch }}-1.3.14-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release alignment
        run: bun run release:check

      - name: Create or update the version pull request
        id: changesets
        uses: changesets/action@v2
        with:
          version: bun run version:packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI on the generated version pull request
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build publishable packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run build

      - name: Pack release artifacts
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run release:pack

      - name: Inspect release artifacts
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run release:inspect

      - name: Publish unpublished packages with npm OIDC
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run release:packages
